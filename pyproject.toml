[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abdelali-khairi", email = "khairiabdelali5@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "fire>=0.7.1",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "mypy>=2.4.0",
    "numpy>=2.2.6",
    "pydantic>=2.14.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[project.scripts]
rag-against-the-machine = "rag_against_the_machine:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
